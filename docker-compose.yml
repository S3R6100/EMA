version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ema-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ema
    ports:
      - '54320:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
